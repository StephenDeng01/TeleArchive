name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建完成后发布到 GitHub Release
        type: boolean
        default: true
      tag:
        description: Release 标签（例如 v0.1.0）
        type: string
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
          pyinstaller --noconfirm --clean telearchive.spec
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telearchive-windows-x64
          path: dist/TeleArchive.exe
          retention-days: 90

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TeleArchive.exe
          generate_release_notes: true

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TeleArchive ${{ inputs.tag }}
          files: dist/TeleArchive.exe
          generate_release_notes: true
