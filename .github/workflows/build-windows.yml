name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建完成后发布到 GitHub Release
        type: boolean
        default: true
      tag:
        description: Release 标签（例如 v0.1.0）
        type: string
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and build
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
          pyinstaller --noconfirm --clean telearchive.spec
          certutil -hashfile dist\TeleArchive.exe SHA256 | findstr /R /C:"^[0-9A-F][0-9A-F]" > dist\TeleArchive.exe.sha256
          dir dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telearchive-windows-x64
          path: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          retention-days: 90

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          generate_release_notes: true

      - name: Update version.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export TAG="${GITHUB_REF_NAME}"
          python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["VERSION"].removeprefix("v")
          tag = os.environ["TAG"]
          owner, repo = "StephenDeng01", "TeleArchive"
          sha = Path("dist/TeleArchive.exe.sha256").read_text(encoding="utf-8").strip().lower()
          doc = {
              "version": version,
              "tag": tag,
              "title": f"TeleArchive {tag}",
              "release_url": f"https://github.com/{owner}/{repo}/releases/tag/{tag}",
              "download_url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/TeleArchive.exe",
              "sha256": sha,
              "notes": "",
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(doc, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Push version.json to main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          git checkout ${{ github.ref_name }} -- version.json
          git add version.json
          git diff --staged --quiet || git commit -m "chore: update version.json for ${{ github.ref_name }}"
          git push origin main

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TeleArchive ${{ inputs.tag }}
          files: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          generate_release_notes: true
