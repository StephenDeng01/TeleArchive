name: Build Windows exe

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 构建完成后发布到 GitHub Release
        type: boolean
        default: true
      tag:
        description: Release 标签（例如 v0.1.0）
        type: string
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install and build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install ".[build]"
          pyinstaller --noconfirm --clean telearchive.spec
          $h = (Get-FileHash -Algorithm SHA256 dist\TeleArchive.exe).Hash.ToLower()
          if ($h -notmatch '^[0-9a-f]{64}$') { throw "invalid sha256: $h" }
          Set-Content -NoNewline -Encoding ascii dist\TeleArchive.exe.sha256 $h
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: telearchive-windows-x64
          path: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          retention-days: 90

      - name: Write version manifest (with sha256)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          export TAG="${GITHUB_REF_NAME}"
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          version = os.environ["VERSION"].removeprefix("v")
          tag = os.environ["TAG"]
          owner, repo = "StephenDeng01", "TeleArchive"
          sha = Path("dist/TeleArchive.exe.sha256").read_text(encoding="utf-8").strip().lower()
          if not re.fullmatch(r"[0-9a-f]{64}", sha):
              raise SystemExit(f"invalid sha256 in dist/TeleArchive.exe.sha256: {sha!r}")
          notes = ""
          manifest = Path("version.json")
          if manifest.is_file():
              try:
                  old = json.loads(manifest.read_text(encoding="utf-8"))
                  notes = str(old.get("notes") or "")
              except json.JSONDecodeError:
                  pass
          doc = {
              "version": version,
              "tag": tag,
              "title": f"TeleArchive {tag}",
              "release_url": f"https://github.com/{owner}/{repo}/releases/tag/{tag}",
              "download_url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/TeleArchive.exe",
              "sha256": sha,
              "notes": notes,
          }
          manifest.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path(os.environ["RUNNER_TEMP"]).joinpath("telearchive-version.json").write_text(
              manifest.read_text(encoding="utf-8"), encoding="utf-8"
          )
          PY

      - name: Publish GitHub Release (tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

      - name: Verify release assets on CDN
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          code_exe=$(curl -fsSL -o /dev/null -w "%{http_code}" "${BASE}/TeleArchive.exe")
          code_sha=$(curl -fsSL -o /dev/null -w "%{http_code}" "${BASE}/TeleArchive.exe.sha256")
          echo "TeleArchive.exe -> ${code_exe}"
          echo "TeleArchive.exe.sha256 -> ${code_sha}"
          test "${code_exe}" = "200"
          test "${code_sha}" = "200"
          curl -fsSL "${BASE}/TeleArchive.exe.sha256" | grep -E '^[0-9a-f]{64}$'

      - name: Push version.json to main
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          BASE="https://github.com/${{ github.repository }}/releases/download/${TAG}"
          SHA=$(curl -fsSL "${BASE}/TeleArchive.exe.sha256" | tr -d '\r\n' | tr 'A-Z' 'a-z')
          echo "sha256 from release CDN: ${SHA}"
          echo "${SHA}" | grep -E '^[0-9a-f]{64}$'
          export VERSION="${GITHUB_REF_NAME#v}"
          export TAG="${GITHUB_REF_NAME}"
          export SHA
          python - <<'PY'
          import json, os
          from pathlib import Path
          owner, repo = "StephenDeng01", "TeleArchive"
          version = os.environ["VERSION"].removeprefix("v")
          tag = os.environ["TAG"]
          sha = os.environ["SHA"].strip().lower()
          notes = ""
          manifest = Path("version.json")
          if manifest.is_file():
              try:
                  old = json.loads(manifest.read_text(encoding="utf-8"))
                  notes = str(old.get("notes") or "")
              except json.JSONDecodeError:
                  pass
          doc = {
              "version": version,
              "tag": tag,
              "title": f"TeleArchive {tag}",
              "release_url": f"https://github.com/{owner}/{repo}/releases/tag/{tag}",
              "download_url": f"https://github.com/{owner}/{repo}/releases/download/{tag}/TeleArchive.exe",
              "sha256": sha,
              "notes": notes,
          }
          manifest.write_text(json.dumps(doc, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          git add version.json
          git diff --staged --quiet && echo "version.json unchanged on main" && exit 0
          git commit -m "chore: update version.json for ${{ github.ref_name }}"
          git push origin main

      - name: Verify version.json sha256 matches release sidecar
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          sleep 5
          python scripts/verify_release_sha.py --tag "${GITHUB_REF_NAME}"

      - name: Publish GitHub Release (manual)
        if: github.event_name == 'workflow_dispatch' && inputs.create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: TeleArchive ${{ inputs.tag }}
          files: |
            dist/TeleArchive.exe
            dist/TeleArchive.exe.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
